name: Web (WASM)

# Upstream has no job that builds apps/deckcraft-web; this fork does, so a change to the
# host-control bridge cannot land unbuilt.
on:
  push:
    branches: [main]
    paths: ['apps/deckcraft-web/**', 'crates/**', 'Cargo.toml', 'Cargo.lock']
  pull_request:
    paths: ['apps/deckcraft-web/**', 'crates/**', 'Cargo.toml', 'Cargo.lock']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target wasm32-unknown-unknown -p deckcraft-web
      - name: Upload the wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: deckcraft-web-wasm
          path: target/wasm32-unknown-unknown/release/deckcraft-web.wasm
          retention-days: 7
